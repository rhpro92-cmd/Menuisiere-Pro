<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Menuiserie Pro">
<meta name="theme-color" content="#0A0A0A">
<title>Menuiserie Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#D4A853;--bg:#080808;--card:#111;--border:#1E1E1E;
  --text:#F5ECD7;--muted:#888;--subtle:#444;--dark:#0D0D0D;
  --red:#E84040;--green:#40C87A;--blue:#4A90E2;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:'DM Mono',monospace;color:var(--text);overflow:hidden;}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top);padding-bottom:var(--safe-bot);}
input,select,textarea{font-family:'DM Mono',monospace;font-size:16px!important;color:var(--text);background:var(--dark);border:1px solid #2A2A2A;border-radius:8px;padding:12px 14px;width:100%;outline:none;-webkit-appearance:none;appearance:none;}
input:focus,textarea:focus,select:focus{border-color:var(--gold);}
textarea{resize:none;line-height:1.5;}
button{font-family:'DM Mono',monospace;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
button:active{opacity:.8;}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:2px;}
select option,optgroup{background:#111;color:var(--text);}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .2s ease both;}
@media print{.noprint{display:none!important}}

/* HEADER */
#header{background:var(--dark);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;padding:0 18px;gap:12px;flex-shrink:0;}
.logo-mark{width:34px;height:34px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#0A0A0A;font-weight:900;font-size:18px;flex-shrink:0;}
.logo-text{font-size:14px;font-weight:700;letter-spacing:.04em;}
.logo-sub{font-size:8px;color:var(--subtle);letter-spacing:.2em;}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px #40C87A88;}

/* TABS */
#tabbar{display:flex;background:var(--dark);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;}
#tabbar::-webkit-scrollbar{display:none;}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:12px 14px;font-size:11px;letter-spacing:.04em;white-space:nowrap;flex-shrink:0;transition:all .15s;}
.tab-btn.active{border-bottom-color:var(--gold);color:var(--gold);}

/* CONTENT */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;}
.card-title{font-size:10px;color:var(--gold);letter-spacing:.15em;font-weight:700;margin-bottom:14px;}
.field{margin-bottom:14px;}
.field label{font-size:10px;color:var(--subtle);letter-spacing:.1em;display:block;margin-bottom:5px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}

/* BUTTONS */
.btn{padding:11px 20px;border-radius:8px;border:none;font-weight:700;font-size:12px;letter-spacing:.06em;}
.btn-primary{background:var(--gold);color:#0A0A0A;}
.btn-ghost{background:transparent;border:1px solid #2A2A2A;color:var(--muted);}
.btn-dark{background:#1A1A1A;border:1px solid #222;color:var(--text);}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:6px;}

/* TOGGLE */
.toggle{width:40px;height:22px;border-radius:11px;border:none;position:relative;transition:background .2s;flex-shrink:0;}
.toggle .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:left .2s;}

/* TYPE BUTTONS */
.type-btn{padding:10px 4px;border-radius:8px;border:1px solid var(--border);background:var(--dark);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-family:'DM Mono',monospace;}
.type-btn.active{border-color:var(--gold);background:rgba(212,168,83,.15);color:var(--gold);}
.type-icon{font-size:18px;}

/* FINISH BUTTONS */
.fin-btn{padding:5px 11px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--muted);display:flex;align-items:center;gap:5px;font-size:11px;font-family:'DM Mono',monospace;}
.fin-btn.active{border-color:var(--gold);background:rgba(212,168,83,.12);color:var(--gold);}
.fin-dot{width:11px;height:11px;border-radius:50%;border:1px solid #444;flex-shrink:0;}

/* PHOTO ZONE */
.photo-zone{height:220px;border-radius:10px;overflow:hidden;border:2px dashed #2A2A2A;background:#050505;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;}
.photo-zone img{width:100%;height:100%;object-fit:cover;}
.photo-placeholder{text-align:center;color:#3A3A3A;pointer-events:none;}
.photo-placeholder .icon{font-size:38px;margin-bottom:8px;}
.photo-placeholder p{font-size:12px;}
.ann-tag{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer;margin:3px 2px;}
.ann-popup{position:absolute;z-index:20;background:var(--dark);border:1px solid var(--gold);border-radius:10px;padding:12px;min-width:170px;}

/* DEDUCTIONS BOX */
.ded-box{background:#050505;border-radius:8px;padding:12px;border:1px solid var(--border);margin-bottom:14px;}
.ded-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid #111;}
.ded-key{font-size:11px;color:var(--muted);}
.ded-val{font-size:13px;color:var(--gold);font-weight:700;}
.ded-formula{font-size:9px;color:var(--subtle);margin-left:6px;}

/* TABLE */
.tbl{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px;}
.tbl-head{background:#0A0A0A;display:grid;}
.tbl-head span,.tbl-row span{padding:7px 8px;font-size:10px;}
.tbl-head span{color:var(--subtle);letter-spacing:.1em;border-bottom:1px solid var(--border);}
.tbl-row{display:grid;border-bottom:1px solid #111;}
.tbl-row:nth-child(even){background:rgba(255,255,255,.02);}
.tbl-row span{font-size:11px;color:var(--muted);}
.tbl-row .piece-name{color:var(--text);font-size:12px;}
.tbl-row .price-col{color:var(--gold);font-weight:700;}
.tbl-note{padding:2px 8px 6px;font-size:10px;color:var(--subtle);font-style:italic;border-bottom:1px solid #111;}
.tbl-foot{background:#0A0A0A;display:flex;justify-content:space-between;padding:8px 10px;}
.tbl-foot span{font-size:11px;color:var(--muted);}
.tbl-foot strong{font-size:13px;color:var(--gold);}

/* COST BOX */
.cost-total{padding:16px 20px;background:rgba(212,168,83,.08);border-radius:10px;border:1px solid rgba(212,168,83,.3);display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
.cost-total-num{font-size:30px;font-weight:700;color:var(--gold);}

/* AGENT */
#chat-messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#050505;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:200px;border:1px solid #1A1A1A;}
.msg-user,.msg-ai{max-width:84%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.7;white-space:pre-wrap;}
.msg-user{background:var(--gold);color:#0A0A0A;align-self:flex-end;border-radius:14px 14px 4px 14px;}
.msg-ai{background:#161616;color:#C4B89A;border:1px solid #2A2A2A;align-self:flex-start;border-radius:14px 14px 14px 4px;}
.ai-avatar{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#0A0A0A;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;margin-right:8px;margin-top:2px;}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block;animation:pulse 1s infinite;}
.quick-btn{background:var(--dark);border:1px solid #2A2A2A;border-radius:12px;color:var(--muted);padding:5px 10px;font-size:10px;font-family:'DM Mono',monospace;cursor:pointer;margin:2px;}

/* MIC */
#mic-btn{width:46px;border-radius:8px;background:var(--dark);border:2px solid #2A2A2A;color:var(--muted);font-size:20px;transition:all .2s;flex-shrink:0;}
#mic-btn.listening{border-color:var(--red);background:rgba(232,64,64,.12);color:var(--red);animation:pulse .8s infinite;}

/* BADGE */
.badge{padding:2px 9px;border-radius:10px;font-size:10px;font-family:'DM Mono',monospace;}

/* SKETCH */
.sketch-wrap{background:#050505;border-radius:10px;padding:18px;display:flex;justify-content:center;align-items:center;min-height:260px;border:1px solid #1A1A1A;overflow-x:auto;}
.view-btn{padding:5px 12px;border-radius:14px;font-size:11px;font-family:'DM Mono',monospace;background:transparent;border:1px solid #2A2A2A;color:var(--muted);}
.view-btn.active{border-color:var(--gold);background:rgba(212,168,83,.18);color:var(--gold);}

/* CUT PLAN */
.sheet-nav-btn{width:26px;height:26px;border-radius:4px;border:1px solid #2A2A2A;background:transparent;color:var(--muted);font-size:11px;font-family:'DM Mono',monospace;}
.sheet-nav-btn.active{border-color:var(--gold);background:var(--gold);color:#0A0A0A;}

/* WORKSHOP */
.ws-pre{background:#050505;border:1px solid #1A1A1A;border-radius:8px;padding:14px;font-size:10.5px;color:#C4B89A;line-height:1.75;font-family:'DM Mono',monospace;white-space:pre;overflow-x:auto;max-height:500px;overflow-y:auto;}

/* DASHBOARD */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px;}
.kpi-label{font-size:9px;color:var(--subtle);letter-spacing:.12em;margin-bottom:5px;}
.kpi-val{font-size:20px;font-weight:700;}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;position:relative;}
.proj-card:hover{border-color:#2A2A2A;}

/* TOAST */
#toast{position:fixed;bottom:calc(26px + var(--safe-bot));left:50%;transform:translateX(-50%);background:#0D2A0D;border:1px solid var(--green);color:var(--green);padding:9px 22px;border-radius:22px;font-size:12px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.6);white-space:nowrap;display:none;}

/* SAVE FLASH */
.btn-save{padding:8px 16px;border-radius:8px;border:none;font-family:'DM Mono',monospace;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap;transition:background .3s;}

/* COUNTER CTRL */
.counter{display:flex;align-items:center;gap:6px;}
.counter-btn{width:28px;height:28px;border-radius:5px;background:#1A1A1A;border:1px solid #2A2A2A;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;}
.counter-val{width:26px;text-align:center;font-size:13px;font-weight:700;font-family:'DM Mono',monospace;}
</style>
</head>
<body>
<div id="app">
  <div id="header" class="noprint">
    <div class="logo-mark" onclick="goHome()">M</div>
    <div onclick="goHome()" style="cursor:pointer">
      <div class="logo-text">Menuiserie Pro</div>
      <div class="logo-sub">CALCULS mm PRÉCIS • PWA</div>
    </div>
    <div id="header-right" style="margin-left:auto;display:flex;align-items:center;gap:10px"></div>
  </div>
  <div id="tabbar" class="noprint" style="display:none"></div>
  <div id="content" class="scroll"></div>
  <div id="toast"></div>
</div>

<script>
'use strict';

// ═══════════════════════════════
// CONSTANTS
// ═══════════════════════════════
const G = '#D4A853';
const RULES = {jeuFacade:2,jeuCote:1,retraitDos:5,epaisseurDos:8,socle:100,retraitTablette:2,kerrf:4};
const SHEET_W=2800,SHEET_H=2070;

const MATS=[
  {id:'mel19',name:'Mélaminé 19mm',e:19,p:19,cat:'Standard'},
  {id:'mel16',name:'Mélaminé 16mm',e:16,p:16,cat:'Standard'},
  {id:'mdf19',name:'MDF 19mm',e:19,p:22,cat:'Standard'},
  {id:'ctb18',name:'Contreplaqué 18mm',e:18,p:32,cat:'Premium'},
  {id:'ctb15',name:'Contreplaqué 15mm',e:15,p:28,cat:'Premium'},
  {id:'mas20',name:'Massif Chêne 20mm',e:20,p:85,cat:'Luxe'},
  {id:'mas22',name:'Massif Noyer 22mm',e:22,p:120,cat:'Luxe'},
];
const MAT_DOS={id:'dos8',name:'Contreplaqué dos 8mm',e:8,p:12};
const MAT_HDF={id:'hdf5',name:'HDF 5mm',e:5,p:8};

const HW_CATALOG=[
  {id:'charni',name:'Charnière Blum 110°',unit:'pce',price:4.2},
  {id:'gliss',name:'Glissière Blum Tandem',unit:'paire',price:22},
  {id:'poignee',name:'Poignée barre 128mm',unit:'pce',price:8.5},
  {id:'pied',name:'Pied réglable',unit:'pce',price:2.8},
  {id:'tasseau',name:'Tasseau tablette',unit:'pce',price:0.9},
  {id:'amort',name:'Amortisseur porte',unit:'paire',price:3.5},
  {id:'barre',name:'Barre penderie ø25mm',unit:'ml',price:6.5},
];

const FINS=[
  {id:'bl',name:'Blanc mat',hex:'#F0EDE6'},{id:'ch',name:'Chêne naturel',hex:'#C8A46E'},
  {id:'an',name:'Gris anthracite',hex:'#4A4A4A'},{id:'no',name:'Noyer',hex:'#5C3317'},
  {id:'nr',name:'Noir mat',hex:'#1C1C1C'},{id:'ve',name:'Vert sauge',hex:'#7A9E7E'},
  {id:'te',name:'Terracotta',hex:'#C4714B'},{id:'lb',name:'Laqué blanc',hex:'#F5F5F5'},
];

const FT=[
  {id:'armoire',l:'Armoire',ic:'▭',w:1200,h:2200,d:600},
  {id:'dressing',l:'Dressing',ic:'⊞',w:2400,h:2400,d:600},
  {id:'cuisine-bas',l:'Caissons bas',ic:'⊓',w:600,h:870,d:600},
  {id:'cuisine-haut',l:'Caissons hauts',ic:'⊔',w:600,h:720,d:350},
  {id:'biblio',l:'Bibliothèque',ic:'≡',w:900,h:2100,d:350},
  {id:'bureau',l:'Bureau',ic:'◫',w:1600,h:750,d:800},
  {id:'rangement',l:'Rangement',ic:'□',w:800,h:1800,d:400},
  {id:'niche',l:'Niche murale',ic:'◻',w:1000,h:300,d:300},
];

const STATUS={
  draft:{l:'Brouillon',c:'#888'},measure:{l:'Prise de cotes',c:'#4A90E2'},
  design:{l:'Conception',c:G},ok:{l:'Validé',c:'#40C87A'},
  prod:{l:'Fabrication',c:'#E84040'},done:{l:'Livré',c:'#8FA58A'},
};

const TABS=[
  {id:'chantier',l:'CHANTIER',i:'📷'},
  {id:'cotes',l:'COTES',i:'📐'},
  {id:'dessin',l:'DESSIN',i:'✏'},
  {id:'agent',l:'AGENT IA',i:'🎤'},
  {id:'conception',l:'3D',i:'✦'},
  {id:'debit',l:'DÉBIT',i:'📋'},
  {id:'coupe',l:'DÉCOUPE',i:'✂'},
  {id:'atelier',l:'ATELIER',i:'🏭'},
];


// ═══════════════════════════════
// STATE
// ═══════════════════════════════
let projects = loadProjects();
let currentProject = null;
let currentView = 'dash'; // 'dash' | 'project'
let currentTab = 'chantier';
let sketchView = 'perspective';
let cutSheetIdx = 0;
let aiChatHistory = [];
let isAiLoading = false;
let isListening = false;
let recognition = null;
let pendingAnnotation = null;
let saveFlash = false;

// ═══════════════════════════════
// STORAGE
// ═══════════════════════════════
function loadProjects(){
  try{return JSON.parse(localStorage.getItem('mp_v4')||'[]');}catch{return [];}
}
function saveProjects(){
  try{localStorage.setItem('mp_v4',JSON.stringify(projects));}catch{}
}
function newProject(){
  return {
    id:null,name:'',client:'',phone:'',email:'',address:'',
    type:'armoire',finish:FINS[0],mat:MATS[0],matDos:MAT_DOS,matFacade:null,hasFacade:true,
    dims:{w:1200,h:2200,d:600},
    photo:null,planPhoto:null,anns:[],
    aiAna:null,designChat:[],notes:'',status:'draft',
    laborRate:'medium',createdAt:null,updatedAt:null
  };
}
function saveCurrentProject(){
  if(!currentProject) return;
  currentProject.updatedAt = Date.now();
  if(!currentProject.id){
    currentProject.id = Date.now();
    currentProject.createdAt = Date.now();
    projects.push(currentProject);
  } else {
    const i = projects.findIndex(p=>p.id===currentProject.id);
    if(i>=0) projects[i]=currentProject; else projects.push(currentProject);
  }
  saveProjects();
  showToast('✓ Projet sauvegardé');
  saveFlash=true; render();
  setTimeout(()=>{saveFlash=false; renderHeaderRight();},1500);
}

// ═══════════════════════════════
// COMPUTATIONS
// ═══════════════════════════════
function getDims(){
  const p = currentProject;
  const {w,h,d} = p.dims;
  const E = p.mat.e;
  const Ed = p.matDos?p.matDos.e:8;
  const Ef = p.hasFacade?(p.matFacade?p.matFacade.e:E):0;
  const profC = p.hasFacade? d-Ef-RULES.jeuFacade : d;
  const largInt = w - E*2;
  const hautInt = h - E*2;
  const largTab = largInt - RULES.retraitTablette*2;
  const profUtil = profC - Ed - RULES.retraitDos;
  return {w,h,d,E,Ed,Ef,profC,largInt,hautInt,largTab,profUtil};
}

function calcPieces(){
  if(!currentProject) return [];
  const p = currentProject;
  const {w,h,d,E,Ed,Ef,profC,largInt,hautInt,largTab,profUtil} = getDims();
  const pieces = [];
  const add=(nom,qty,longueur,largeur,mat,prix,note='')=>{
    const prixCalc = Math.round((longueur/1000)*(largeur/1000)*(prix||p.mat.p)*qty);
    pieces.push({nom,qty,longueur:Math.round(longueur),largeur:Math.round(largeur),
      matiere:mat||p.mat.name,prix:prixCalc,note});
  };
  const t = p.type;
  if(['armoire','dressing','rangement'].includes(t)){
    add('Côté gauche',1,h,profC,null,null,`Pleine hauteur ${h}mm`);
    add('Côté droit',1,h,profC,null,null,`Pleine hauteur ${h}mm`);
    add('Dessus',1,largInt,profC,null,null,`${w}-2×${E}=${largInt}mm`);
    add('Dessous',1,largInt,profC,null,null,`Idem dessus`);
    add('Fond',1,h-6,largInt+E*2-6,`Contreplaqué ${Ed}mm`,Ed<10?8:12,`Rainuré dans montants`);
    const nSh = t==='biblio'?4:t==='dressing'?2:3;
    for(let i=0;i<nSh;i++) add(`Étagère ${i+1}`,1,largTab,profUtil,null,null,`Intérieur -2mm/côté = ${largTab}mm`);
    if(p.hasFacade){
      const nP = w>900?(w>1500?3:2):1;
      const lFac = Math.round(w/nP - RULES.jeuCote*2 - 1);
      const hFac = h - RULES.jeuFacade*2;
      for(let i=0;i<nP;i++) add(`Façade porte ${i+1}`,1,hFac,lFac,p.matFacade?p.matFacade.name:p.mat.name,p.matFacade?p.matFacade.p:p.mat.p,`Jeu ${RULES.jeuFacade}mm/côté → ${hFac}×${lFac}mm`);
    }
    if(t==='dressing') add('Barre penderie',1,largInt-20,25,'Acier chromé ø25mm',6.5,`Long: ${largInt-20}mm`);
  } else if(t==='biblio'){
    add('Côté gauche',1,h,profC);add('Côté droit',1,h,profC);
    add('Dessus',1,largInt,profC);add('Dessous',1,largInt,profC);
    add('Fond',1,h-6,largInt+E*2-6,`Contreplaqué ${Ed}mm`,Ed<10?8:12);
    add('Montant central',1,hautInt,profC);
    for(let i=0;i<4;i++) add(`Étagère ${i+1}`,2,Math.round((largInt-E)/2)-RULES.retraitTablette,profUtil);
  } else if(t==='cuisine-bas'){
    const hC = h - RULES.socle;
    add('Côté gauche',1,hC,profC,null,null,`Sans socle: ${hC}mm`);
    add('Côté droit',1,hC,profC,null,null,`Sans socle: ${hC}mm`);

function calcHardware(pieces){
  if(!currentProject) return [];
  const p = currentProject;
  const {w,largInt} = getDims();
  const hw=[];
  const portes = pieces.filter(x=>x.nom.toLowerCase().includes('façade porte')||x.nom.toLowerCase().includes('porte haute'));
  if(portes.length>0){
    const tot=portes.reduce((s,x)=>s+x.qty,0);
    hw.push({name:'Charnière Blum 110°',qty:tot*2,unit:'pce',price:4.2,note:`${tot} porte(s) × 2`,total:Math.round(tot*2*4.2*100)/100});
    hw.push({name:'Amortisseur porte',qty:tot,unit:'paire',price:3.5,note:`1 paire/porte`,total:Math.round(tot*3.5*100)/100});
  }
  const tiroirs=pieces.filter(x=>x.nom.toLowerCase().includes('tiroir'));
  if(tiroirs.length>0){
    const n=tiroirs.filter(x=>x.nom.toLowerCase().includes('corps')||x.nom.toLowerCase().includes('façade tir')).length||2;
    hw.push({name:'Glissière Blum Tandem 450',qty:n,unit:'paire',price:22,note:`${n} tiroir(s)`,total:n*22});
  }
  const tabs=pieces.filter(x=>x.nom.toLowerCase().includes('étagère'));
  if(tabs.length>0) hw.push({name:'Tasseau tablette',qty:tabs.length*4*2,unit:'pce',price:0.9,note:`4/tablette × 2 positions`,total:Math.round(tabs.length*4*2*0.9*100)/100});
  if(['armoire','cuisine-bas','rangement'].includes(p.type)) hw.push({name:'Pied réglable',qty:4,unit:'pce',price:2.8,note:'Réglage ±25mm',total:4*2.8});
  if(p.type==='dressing'){
    const lm=(largInt-20)/1000;
    hw.push({name:'Barre penderie ø25mm',qty:Math.ceil(lm*10)/10,unit:'ml',price:6.5,note:`${largInt-20}mm`,total:Math.round(Math.ceil(lm*10)/10*6.5*100)/100});
  }
  return hw;
}

function calcCosts(pieces,hw){
  const p=currentProject;
  const matTotal=pieces.reduce((s,x)=>s+x.prix,0);
  const hwTotal=hw.reduce((s,x)=>s+x.total,0);
  const rates={simple:45,medium:65,complex:85};
  const lr=rates[p.laborRate||'medium'];
  const lh=Math.max(4,Math.round((p.dims.w/1000)*(p.dims.h/1000)*3));
  const lc=lh*lr;
  return {matTotal,hwTotal,lr,lh,lc,total:matTotal+hwTotal+lc};
}

function optimizeCuts(pieces){
  const all=[];
  pieces.forEach(p=>{for(let i=0;i<p.qty;i++) all.push({name:p.nom,w:p.longueur,h:p.largeur});});
  const sorted=[...all].sort((a,b)=>b.h-a.h);
  const sheets=[];
  sorted.forEach(piece=>{
    if(piece.w>SHEET_W||piece.h>SHEET_H) return;
    let placed=false;
    for(const sh of sheets){
      for(const shelf of sh){
        if(shelf.rw>=piece.w+RULES.kerrf&&shelf.h>=piece.h){
          shelf.pieces.push({...piece,x:shelf.uw,y:shelf.y});
          shelf.uw+=piece.w+RULES.kerrf;shelf.rw-=piece.w+RULES.kerrf;placed=true;break;
        }
      }
      if(placed) break;
      const uh=sh.reduce((s,sl)=>s+sl.h+RULES.kerrf,0);
      if(SHEET_H-uh>=piece.h){sh.push({y:uh,h:piece.h,uw:piece.w+RULES.kerrf,rw:SHEET_W-piece.w-RULES.kerrf,pieces:[{...piece,x:0,y:uh}]});placed=true;}
      if(placed) break;
    }
    if(!placed) sheets.push([{y:0,h:piece.h,uw:piece.w+RULES.kerrf,rw:SHEET_W-piece.w-RULES.kerrf,pieces:[{...piece,x:0,y:0}]}]);
  });
  return sheets.map(sh=>{
    const used=sh.reduce((s,sl)=>s+sl.pieces.reduce((s2,p)=>s2+p.w*p.h,0),0);
    return{shelves:sh,eff:Math.round(used/(SHEET_W*SHEET_H)*100),used,waste:SHEET_W*SHEET_H-used};
  });
}

const AI_SYS = `Tu es un expert ébéniste-concepteur avec 20 ans d'expérience. Tu maîtrises:
- Calculs menuiserie en mm: déductions épaisseurs, jeux de montage, profondeurs carcasse
- Formules: profC = prof_totale - ep_facade - 2mm_jeu, largInt = largeur - 2×ep, tablettes = largInt - 4mm
- Quincaillerie Blum, plans de coupe, optimisation matière

IMPORTANT: Quand l'utilisateur te demande de modifier des dimensions ou paramètres, tu DOIS inclure dans ta réponse un bloc JSON EXACT en fin de message entre les balises ###JSON### et ###END###.

Format du bloc de commandes:
###JSON###
{"actions":[
  {"type":"dim","key":"w","value":1200},
  {"type":"dim","key":"h","value":2200},
  {"type":"dim","key":"d","value":600},
  {"type":"type","value":"armoire"},
  {"type":"mat","id":"mel19"},
  {"type":"hasFacade","value":true},
  {"type":"note","value":"texte de la note"}
]}
###END###

Types d'actions disponibles: dim (w/h/d en mm), type (id du meuble), mat (id matériau), hasFacade (true/false), note.

Contexte projet actuel: {CTX}

Réponds en français, de façon concise et professionnelle.`;

async function callAI(msgs, img64){
  const p=currentProject;
  const {w,h,d,E,profC,largInt,largTab}=getDims();
  const ctx2=`Type=${p.type}, HOT=${w}x${h}x${d}mm, Mat=${p.mat.name}(${E}mm), Facade=${p.hasFacade?((p.matFacade?p.matFacade.name:p.mat.name)+'facade'):'non'}, ProfCarcasse=${profC}mm, LargInt=${largInt}mm, Tablette=${largTab}mm`;
  const sys=AI_SYS.replace('{CTX}',ctx2);
  const last=msgs[msgs.length-1];
  const msgContent=img64?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img64}},{type:'text',text:last.content}]:last.content;
  const apiMsgs=[...msgs.slice(0,-1),{role:last.role,content:msgContent}];
  const controller=new AbortController();
  const tid=setTimeout(()=>controller.abort(),28000);
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system:sys,messages:apiMsgs}),
      signal:controller.signal
    });
    clearTimeout(tid);
    if(!resp.ok){
      const errBody=await resp.text();
      throw new Error('Erreur API '+resp.status+'. Connectez-vous sur claude.ai puis réessayez.');
    }
    const data=await resp.json();
    if(data.error) throw new Error(data.error.message||'Erreur API Claude');
    return data.content?.map(b=>b.text||'').join('')||'Réponse vide.';
  }catch(err){
    clearTimeout(tid);
    if(err.name==='AbortError') throw new Error('Délai dépassé (28s). Vérifiez votre connexion internet.');
    throw err;
  }
}

function parseAndExecuteActions(reply){
  const match = reply.match(/###JSON###([\s\S]*?)###END###/);
  if(!match) return reply;
  try{
    const data=JSON.parse(match[1].trim());
    const actions=data.actions||[];
    let changed=false;
    actions.forEach(a=>{
      if(a.type==='dim'&&a.key&&a.value){
        currentProject.dims[a.key]=parseInt(a.value)||currentProject.dims[a.key];
        changed=true;
      } else if(a.type==='type'&&a.value){
        const ft=FT.find(f=>f.id===a.value);
        if(ft){currentProject.type=ft.id;changed=true;}
      } else if(a.type==='mat'&&a.id){
        const m=MATS.find(m=>m.id===a.id);
        if(m){currentProject.mat=m;changed=true;}
      } else if(a.type==='hasFacade'){
        currentProject.hasFacade=!!a.value;changed=true;
      } else if(a.type==='note'&&a.value){
        currentProject.notes=(currentProject.notes?currentProject.notes+'\n':'')+a.value;changed=true;
      }
    });
    if(changed) showToast('✓ Projet mis à jour par l\'IA');
  }catch(e){}
  return reply.replace(/###JSON###[\s\S]*?###END###/,'').trim();
}

async function sendAgentMessage(text){
  if(!text||!text.trim()||isAiLoading) return;
  isAiLoading=true;
  const userMsg={role:'user',content:text.trim()};
  currentProject.designChat=[...currentProject.designChat,userMsg];
  renderAgentChat();
  try{
    const reply=await callAI(currentProject.designChat);
    const cleaned=parseAndExecuteActions(reply);
    currentProject.designChat=[...currentProject.designChat,{role:'assistant',content:cleaned}];
  }catch(e){
    const errMsg=e.message||'Erreur inconnue';
    currentProject.designChat=[...currentProject.designChat,{role:'assistant',content:'⚠ '+errMsg}];
    console.error('AI Error:',e);
  }
  isAiLoading=false;
  renderAgentChat();
  if(currentTab==='debit'||currentTab==='coupe') renderTabContent();
}

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Dictée vocale non disponible sur ce navigateur. Utilisez Safari sur iOS.');return;}
  if(isListening){recognition&&recognition.stop();return;}
  recognition=new SR();
  recognition.lang='fr-FR';recognition.continuous=false;recognition.interimResults=true;
  recognition.onresult=e=>{
    const t=Array.from(e.results).map(r=>r[0].transcript).join('');
    const inp=document.getElementById('agent-input');
    if(inp) inp.value=t;
  };
  recognition.onend=()=>{
    isListening=false;
    const mb=document.getElementById('mic-btn');
    if(mb){mb.classList.remove('listening');mb.textContent='🎤';}
    const inp=document.getElementById('agent-input');
    if(inp&&inp.value.trim()) sendAgentMessage(inp.value);
  };
  recognition.onerror=()=>{isListening=false;const mb=document.getElementById('mic-btn');if(mb){mb.classList.remove('listening');mb.textContent='🎤';}};
  recognition.start();
  isListening=true;
  const mb=document.getElementById('mic-btn');
  if(mb){mb.classList.add('listening');mb.textContent='⏹';}
}

  const zone=e.currentTarget;

  const clientX=e.touches?e.touches[0].clientX:e.clientX;

  const x=((clientX-rect.left)/rect.width)*100;
  const y=((clientY-rect.top)/rect.height)*100;
  pendingAnnotation={x,y};
  renderTabContent();
}

}

function makeCutSVG(sheet){
  const COLS=['#D4A853','#4A90E2','#40C87A','#E84040','#A855F7','#F59E0B','#06B6D4','#EC4899','#84CC16','#F97316'];
  const cm={};let ci=0;
  sheet.shelves.forEach(sl=>sl.pieces.forEach(p=>{if(!cm[p.name])cm[p.name]=COLS[ci++%COLS.length];}));
  const scX=300/SHEET_W,scY=148/SHEET_H;
  let s=`<svg width="300" height="148" style="display:block;border-radius:6px"><rect width="300" height="148" fill="#1A1210" stroke="#3A2A0A" stroke-width="1"/>`;
  sheet.shelves.forEach(sl=>sl.pieces.forEach(pc=>{
    s+=`<rect x="${pc.x*scX}" y="${pc.y*scY}" width="${Math.max(1,pc.w*scX-2)}" height="${Math.max(1,pc.h*scY-2)}" fill="${cm[pc.name]}" opacity=".78" rx="1"/>`;
    s+=`<text x="${pc.x*scX+3}" y="${pc.y*scY+9}" font-size="5.5" fill="#fff" font-family="monospace">${(pc.name||'').substring(0,16)}</text>`;
    s+=`<text x="${pc.x*scX+3}" y="${pc.y*scY+17}" font-size="4.5" fill="rgba(255,255,255,.7)" font-family="monospace">${pc.w}×${pc.h}</text>`;
  }));
  s+=`</svg>`;return s;
}

function showToast(msg){
  const t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._to);t._to=setTimeout(()=>{t.style.display='none';},2200);
}

function el(tag,attrs,children){
  const e=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='html') e.innerHTML=v;
    else if(k==='style') e.style.cssText=v;
    else if(k.startsWith('on')&&typeof v==='function') e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  if(children) [].concat(children).forEach(c=>{
    if(c==null||c===false) return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}

function selectEl(id,opts,val,onChange){
  const s=el('select',{style:'background:#0D0D0D;border:1px solid #2A2A2A;border-radius:8px;color:#F5ECD7;padding:12px 14px;font-family:\'DM Mono\',monospace;font-size:16px;width:100%;outline:none;cursor:pointer'});
  opts.forEach(([v,l,grp])=>{
    if(grp){
      const og=el('optgroup',{label:grp});
      og.style.background='#111';s.appendChild(og);
    } else {
      const o=el('option',{value:v,style:'background:#111'});
      o.textContent=l;if(v===val) o.selected=true;
      (s.lastChild&&s.lastChild.tagName==='OPTGROUP'?s.lastChild:s).appendChild(o);
    }
  });
  s.addEventListener('change',e=>onChange(e.target.value));
  return s;
}

function inputEl(val,onChange,placeholder,type='text'){
  const i=el('input',{type,placeholder:placeholder||'',value:val||'',autocomplete:'off',autocorrect:'off',autocapitalize:'none',spellcheck:'false'});
  i.style.cssText='background:#0D0D0D;border:1px solid #2A2A2A;border-radius:8px;color:#F5ECD7;padding:12px 14px;font-family:\'DM Mono\',monospace;font-size:16px;width:100%;outline:none;-webkit-appearance:none;';
  i.addEventListener('input',e=>onChange(e.target.value));
  i.addEventListener('focus',e=>e.target.style.borderColor=G);
  i.addEventListener('blur',e=>e.target.style.borderColor='#2A2A2A');
  return i;
}

function numberInputEl(val,onChange){
  const i=el('input',{type:'number',value:val||0,inputmode:'numeric',autocomplete:'off'});
  i.style.cssText='background:#0D0D0D;border:1px solid #2A2A2A;border-radius:8px;color:#F5ECD7;padding:12px 14px;font-family:\'DM Mono\',monospace;font-size:16px;width:100%;outline:none;-webkit-appearance:none;';
  i.addEventListener('change',e=>onChange(parseFloat(e.target.value)||0));
  i.addEventListener('focus',e=>{e.target.style.borderColor=G;e.target.select&&e.target.select();});
  i.addEventListener('blur',e=>e.target.style.borderColor='#2A2A2A');
  return i;
}

function textareaEl(val,onChange,placeholder){
  const t=el('textarea',{placeholder:placeholder||'',autocomplete:'off',autocorrect:'off'});
  t.style.cssText='background:#0D0D0D;border:1px solid #2A2A2A;border-radius:8px;color:#F5ECD7;padding:12px 14px;font-family:\'DM Mono\',monospace;font-size:16px;width:100%;outline:none;resize:none;line-height:1.5;height:80px;-webkit-appearance:none;';
  t.value=val||'';
  t.addEventListener('input',e=>onChange(e.target.value));
  t.addEventListener('focus',e=>e.target.style.borderColor=G);
  t.addEventListener('blur',e=>e.target.style.borderColor='#2A2A2A');
  return t;
}

function fieldDiv(label,inputEl){
  const d=el('div',{class:'field'});
  d.appendChild(el('label',{},label));
  d.appendChild(inputEl);
  return d;
}

function sectionTitle(text){
  const d=el('div',{class:'card-title'});d.textContent=text;return d;
}

function badge(status){
  const st=STATUS[status]||STATUS.draft;
  const b=el('span',{class:'badge'});
  b.textContent=st.l;
  b.style.cssText=`background:${st.c}22;color:${st.c};border:1px solid ${st.c}44;`;
  return b;
}

function btnEl(label,cls,onClick){
  const b=el('button',{class:'btn '+cls});b.textContent=label;
  b.addEventListener('click',onClick);return b;
}

    const img=el('img',{src:p.photo});zone.appendChild(img);
    zone.addEventListener('click',e=>startAnnotation(e,'photo'));

    // Annotations
    p.anns.forEach(ann=>{
      const AC={X:'#E84040',Y:'#40C87A',Z:'#4A90E2'};
      const at=el('div',{style:`position:absolute;left:${ann.x}%;top:${ann.y}%;transform:translate(-50%,-100%);z-index:5`});
      const tag=el('div',{style:`background:${AC[ann.axis]};color:#fff;padding:2px 7px;border-radius:4px;font-size:11px;font-family:'DM Mono',monospace;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.6)`});

      setTimeout(()=>{const inp=document.getElementById('ann-val-input');if(inp){inp.focus();}},100);

function snapLineAngle(x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1;
  const angle=Math.atan2(dy,dx)*180/Math.PI;
  const snapAngles=[0,45,90,135,180,-45,-90,-135,-180];
  let closest=snapAngles[0],minDiff=360;
  snapAngles.forEach(a=>{const d=Math.abs(((angle-a+540)%360)-180);if(d<minDiff){minDiff=d;closest=a;}});
  if(minDiff>12) return {x2,y2,snapped:false,label:''};
  const dist=Math.sqrt(dx*dx+dy*dy);
  const rad=closest*Math.PI/180;
  return {
    x2:x1+Math.cos(rad)*dist,
    y2:y1+Math.sin(rad)*dist,
    snapped:true,
    label:closest===0||closest===180||closest===-180?'HORIZONTAL':Math.abs(closest)===90?'VERTICAL':closest+'°'
  };
}

function snapRect(x1,y1,x2,y2,squarify){
  if(!squarify) return {x1,y1,x2,y2};
  const w=Math.abs(x2-x1),h=Math.abs(y2-y1);
  const s=Math.max(w,h);
  return {x1,y1,x2:x1+(x2>x1?s:-s),y2:y1+(y2>y1?s:-s)};
}

function initCanvas(canvas){
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  const w=Math.max(rect.width||700,700);
  const h=Math.round(w*0.65);
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.height=h+'px';
  drawState.canvasW=w;drawState.canvasH=h;drawState.scale=dpr;

  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  // Background grid
  drawGrid(ctx,w,h);

  // Restore strokes
  redrawCanvas();

  // Events — pointer (works for Pencil + touch + mouse)
  canvas.addEventListener('pointerdown',onPointerDown,{passive:false});
  canvas.addEventListener('pointermove',onPointerMove,{passive:false});
  canvas.addEventListener('pointerup',onPointerUp,{passive:false});
  canvas.addEventListener('pointercancel',onPointerUp,{passive:false});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
}

function drawGrid(ctx,w,h){
  ctx.fillStyle='#0A0A0A';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#1A1A1A';ctx.lineWidth=.5;
  const step=20;
  for(let x=0;x<=w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<=h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  // Major grid
  ctx.strokeStyle='#222';ctx.lineWidth=.8;
  for(let x=0;x<=w;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<=h;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
}

function redrawCanvas(){
  const canvas=document.getElementById('draw-canvas');if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const dpr=drawState.scale;
  const w=drawState.canvasW,h=drawState.canvasH;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawGrid(ctx,w,h);
  drawState.strokes.forEach(s=>renderStroke(ctx,s));
}

function renderStroke(ctx,s){
  ctx.save();
  ctx.strokeStyle=s.color||'#F5ECD7';
  ctx.fillStyle=s.color||'#F5ECD7';
  ctx.lineWidth=s.width||2;
  ctx.lineCap='round';ctx.lineJoin='round';

  if(s.type==='pen'&&s.points&&s.points.length>1){
    ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
    for(let i=1;i<s.points.length;i++){
      const prev=s.points[i-1],curr=s.points[i];
      const mx=(prev.x+curr.x)/2,my=(prev.y+curr.y)/2;
      ctx.quadraticCurveTo(prev.x,prev.y,mx,my);
    }
    ctx.stroke();
  } else if(s.type==='line'){
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
    // Arrow heads if arrow type
  } else if(s.type==='arrow'){
    drawArrow(ctx,s.x1,s.y1,s.x2,s.y2,s.width||2);
  } else if(s.type==='rect'){
    ctx.beginPath();ctx.rect(s.x,s.y,s.w,s.h);ctx.stroke();
  } else if(s.type==='circle'){
    ctx.beginPath();ctx.ellipse(s.cx,s.cy,s.rx,s.ry,0,0,Math.PI*2);ctx.stroke();
  } else if(s.type==='text'){
    ctx.font=`${s.fontSize||14}px 'DM Mono',monospace`;
    ctx.fillText(s.text||'',s.x,s.y);
  } else if(s.type==='eraser'&&s.points){
    ctx.globalCompositeOperation='destination-out';
    ctx.lineWidth=s.width*3||20;
    ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
    s.points.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();
    ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();
}

function drawArrow(ctx,x1,y1,x2,y2,w){
  const angle=Math.atan2(y2-y1,x2-x1);
  const hw=Math.max(w*3,8);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hw*Math.cos(angle-Math.PI/6),y2-hw*Math.sin(angle-Math.PI/6));
  ctx.lineTo(x2-hw*Math.cos(angle+Math.PI/6),y2-hw*Math.sin(angle+Math.PI/6));
  ctx.closePath();ctx.fill();
}

function getCanvasPos(canvas,e){
  const rect=canvas.getBoundingClientRect();
  const scaleX=drawState.canvasW/rect.width;
  const scaleY=drawState.canvasH/rect.height;
  const clientX=e.clientX||e.touches?.[0]?.clientX||0;
  const clientY=e.clientY||e.touches?.[0]?.clientY||0;
  return {x:(clientX-rect.left)*scaleX,y:(clientY-rect.top)*scaleY};
}

function onPointerDown(e){
  e.preventDefault();
  const canvas=e.target;
  const {x,y}=getCanvasPos(canvas,e);
  drawState.isDrawing=true;
  drawState.startX=x;drawState.startY=y;
  drawState.lastPressure=e.pressure>0?e.pressure:1;
  drawState.redoStack=[];

  if(drawState.tool==='text'){
    const text=prompt('Saisissez votre annotation:');
    if(text){
      drawState.strokes.push({type:'text',x,y,text,color:drawState.color,fontSize:14});
      redrawCanvas();
    }
    drawState.isDrawing=false;return;
  }

  if(drawState.tool==='pen'||drawState.tool==='eraser'){
    const sw=drawState.tool==='eraser'?drawState.strokeWidth*3:drawState.strokeWidth;
    drawState.currentStroke={type:drawState.tool,color:drawState.color,width:sw,points:[{x,y,p:e.pressure||1}]};
  }
}

function onPointerMove(e){
  e.preventDefault();
  if(!drawState.isDrawing) return;
  const canvas=e.target;
  const {x,y}=getCanvasPos(canvas,e);
  const ctx=canvas.getContext('2d');

  if(drawState.tool==='pen'||drawState.tool==='eraser'){
    drawState.currentStroke.points.push({x,y,p:e.pressure||1});
    // Draw incrementally
    ctx.save();
    ctx.strokeStyle=drawState.currentStroke.color;
    ctx.lineWidth=drawState.currentStroke.width;
    ctx.lineCap='round';ctx.lineJoin='round';
    if(drawState.tool==='eraser') ctx.globalCompositeOperation='destination-out';
    const pts=drawState.currentStroke.points;
    if(pts.length>=2){
      const prev=pts[pts.length-2],curr=pts[pts.length-1];
      ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(curr.x,curr.y);ctx.stroke();
    }
    ctx.restore();
  } else {
    // Preview shapes
    redrawCanvas();
    ctx.save();
    ctx.strokeStyle=drawState.color;ctx.fillStyle=drawState.color;
    ctx.lineWidth=drawState.strokeWidth;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.setLineDash([5,5]);

    const sx=drawState.startX,sy=drawState.startY;
    const snapInd=document.getElementById('snap-indicator');

    if(drawState.tool==='line'||drawState.tool==='arrow'){
      let tx=x,ty=y,snapLabel='';
      if(drawState.snapAngle){
        const s=snapLineAngle(sx,sy,x,y);
        tx=s.x2;ty=s.y2;snapLabel=s.label;
      }
      if(snapInd){if(snapLabel){snapInd.textContent=snapLabel;snapInd.classList.add('show');}else snapInd.classList.remove('show');}
      if(drawState.tool==='arrow') drawArrow(ctx,sx,sy,tx,ty,drawState.strokeWidth);
      else{ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.stroke();}
    } else if(drawState.tool==='rect'){
      const rw=x-sx,rh=y-sy;
      ctx.beginPath();ctx.rect(sx,sy,rw,rh);ctx.stroke();
    } else if(drawState.tool==='circle'){
      const rx=Math.abs(x-sx)/2,ry=Math.abs(y-sy)/2;
      const cx=sx+(x-sx)/2,cy=sy+(y-sy)/2;
      ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();
    }
    ctx.setLineDash([]);ctx.restore();
  }
}

function onPointerUp(e){
  if(!drawState.isDrawing) return;
  drawState.isDrawing=false;
  const canvas=document.getElementById('draw-canvas');
  if(!canvas) return;
  const {x,y}=getCanvasPos(canvas,e);
  const sx=drawState.startX,sy=drawState.startY;
  const snapInd=document.getElementById('snap-indicator');
  if(snapInd) snapInd.classList.remove('show');

  if(drawState.tool==='pen'||drawState.tool==='eraser'){
    if(drawState.currentStroke&&drawState.currentStroke.points.length>1){
      drawState.strokes.push(drawState.currentStroke);
    }
    drawState.currentStroke=null;
  } else if(drawState.tool==='line'||drawState.tool==='arrow'){
    let tx=x,ty=y;
    if(drawState.snapAngle){const s=snapLineAngle(sx,sy,x,y);tx=s.x2;ty=s.y2;}
    const dist=Math.sqrt((tx-sx)**2+(ty-sy)**2);
    if(dist>5) drawState.strokes.push({type:drawState.tool,x1:sx,y1:sy,x2:tx,y2:ty,color:drawState.color,width:drawState.strokeWidth});
  } else if(drawState.tool==='rect'){
    const rw=x-sx,rh=y-sy;
    if(Math.abs(rw)>5&&Math.abs(rh)>5) drawState.strokes.push({type:'rect',x:sx,y:sy,w:rw,h:rh,color:drawState.color,width:drawState.strokeWidth});
  } else if(drawState.tool==='circle'){
    const rx=Math.abs(x-sx)/2,ry=Math.abs(y-sy)/2;
    const cx=sx+(x-sx)/2,cy=sy+(y-sy)/2;
    if(rx>3&&ry>3) drawState.strokes.push({type:'circle',cx,cy,rx,ry,color:drawState.color,width:drawState.strokeWidth});
  }
  redrawCanvas();
}


</script>
